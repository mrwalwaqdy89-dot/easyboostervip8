<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login - ANDY RCH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --accent: #8b5cf6;
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: rgba(17, 24, 39, 0.7);
            --border-color: rgba(99, 102, 241, 0.2);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --success: #10b981;
            --error: #ef4444;
        }
        
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html, body {
            height: 100%;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Animated Gradient Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(ellipse 80% 80% at 50% -20%, rgba(99, 102, 241, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse 60% 60% at 0% 100%, rgba(139, 92, 246, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse 60% 60% at 100% 100%, rgba(99, 102, 241, 0.15) 0%, transparent 50%);
            animation: bgFloat 20s ease-in-out infinite;
        }

        @keyframes bgFloat {
            0%, 100% { 
                opacity: 1;
                transform: scale(1);
            }
            50% { 
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        /* Floating Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            top: -100px;
            right: -100px;
            animation: orbFloat1 15s ease-in-out infinite;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, var(--accent), #ec4899);
            bottom: -80px;
            left: -80px;
            animation: orbFloat2 18s ease-in-out infinite;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #06b6d4, var(--primary));
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: orbFloat3 12s ease-in-out infinite;
        }

        @keyframes orbFloat1 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-30px, 20px) rotate(120deg); }
            66% { transform: translate(20px, -30px) rotate(240deg); }
        }

        @keyframes orbFloat2 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(40px, -20px) rotate(-120deg); }
            66% { transform: translate(-20px, 40px) rotate(-240deg); }
        }

        @keyframes orbFloat3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.2; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.3; }
        }

        /* Grid Pattern Overlay */
        .grid-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.03;
            background-image: 
                linear-gradient(var(--primary) 1px, transparent 1px),
                linear-gradient(90deg, var(--primary) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        /* Glass Card */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 1px 0 0 rgba(255, 255, 255, 0.08) inset;
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent) 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Logo Container */
        .logo-container {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 50%, #a855f7 100%);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 
                0 20px 50px rgba(99, 102, 241, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            animation: logoFloat 4s ease-in-out infinite;
        }

        .logo-container::before {
            content: '';
            position: absolute;
            inset: -3px;
            background: linear-gradient(135deg, var(--primary), var(--accent), #ec4899, var(--primary));
            border-radius: 30px;
            z-index: -1;
            opacity: 0.5;
            filter: blur(15px);
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        /* Admin Badge */
        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.15));
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 50px;
            font-size: 13px;
            color: var(--primary-light);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
        }

        .admin-badge i {
            font-size: 12px;
        }

        /* Input Styles */
        .input-group {
            position: relative;
        }

        .input-label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .input-field {
            width: 100%;
            padding: 16px 18px 16px 52px;
            background: rgba(17, 24, 39, 0.5);
            border: 2px solid rgba(99, 102, 241, 0.15);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .input-field::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .input-field:hover {
            border-color: rgba(99, 102, 241, 0.3);
            background: rgba(17, 24, 39, 0.7);
        }

        .input-field:focus {
            border-color: var(--primary);
            background: rgba(17, 24, 39, 0.8);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .input-field:focus + .input-icon,
        .input-wrapper:focus-within .input-icon {
            color: var(--primary);
        }

        /* Submit Button */
        .admin-btn {
            width: 100%;
            padding: 18px 32px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            background-size: 200% 200%;
            color: white;
            font-weight: 700;
            font-size: 16px;
            border: none;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 4px 20px rgba(99, 102, 241, 0.4),
                0 1px 0 0 rgba(255, 255, 255, 0.1) inset;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.3px;
        }

        .admin-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: left 0.6s ease;
        }

        .admin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 12px 40px rgba(99, 102, 241, 0.5),
                0 1px 0 0 rgba(255, 255, 255, 0.15) inset;
            background-position: 100% 100%;
        }

        .admin-btn:hover::before {
            left: 100%;
        }

        .admin-btn:active {
            transform: translateY(-1px);
        }

        .admin-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Error Message */
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 12px;
            animation: shakeError 0.4s ease;
        }

        .error-message.show {
            display: flex;
        }

        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-4px); }
        }

        /* Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Back Link */
        .back-link {
            position: fixed;
            top: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            padding: 12px 20px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .back-link:hover {
            color: var(--primary-light);
            border-color: rgba(99, 102, 241, 0.4);
            background: rgba(99, 102, 241, 0.1);
            transform: translateX(-3px);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .animate-delay-1 { animation-delay: 0.1s; }
        .animate-delay-2 { animation-delay: 0.2s; }
        .animate-delay-3 { animation-delay: 0.3s; }
        .animate-delay-4 { animation-delay: 0.4s; }
        .animate-delay-5 { animation-delay: 0.5s; }

        /* Footer Text */
        .footer-text {
            color: var(--text-muted);
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .footer-text i {
            color: var(--primary);
            opacity: 0.6;
        }

        /* Copyright */
        .copyright {
            color: rgba(107, 114, 128, 0.6);
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        /* Responsive Adjustments */
        @media (max-width: 640px) {
            .back-link {
                top: 16px;
                left: 16px;
                padding: 10px 16px;
                font-size: 13px;
            }

            .glass-card {
                border-radius: 24px;
            }

            .logo-container {
                width: 85px;
                height: 85px;
                border-radius: 24px;
            }

            .admin-btn {
                padding: 16px 28px;
            }

            h1 {
                font-size: 1.75rem !important;
            }
        }

        @media (max-width: 380px) {
            .glass-card {
                margin: 0 8px;
                padding: 24px !important;
            }

            .admin-badge {
                padding: 8px 16px;
                font-size: 11px;
            }
        }

        /* Password visibility toggle */
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--primary-light);
        }
    </style>
</head>
<body>
    <!-- Background Elements -->
    <div class="animated-bg"></div>
    <div class="grid-pattern"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    
    <!-- Back Link -->
    <a href="/" class="back-link">
        <i class="fas fa-arrow-left"></i>
        <span>Back to Home</span>
    </a>

    <!-- Main Content -->
    <div class="relative z-10 w-full max-w-md mx-4">
        <div class="glass-card p-8 sm:p-10">
            <!-- Logo -->
            <div class="flex justify-center mb-8 opacity-0 animate-in">
                <div class="logo-container">
                    <i class="fas fa-shield-halved text-white text-4xl"></i>
                </div>
            </div>

            <!-- Title -->
            <div class="text-center mb-8 opacity-0 animate-in animate-delay-1">
                <h1 class="text-3xl sm:text-4xl font-bold mb-3 tracking-tight">
                    <span class="gradient-text">Admin Portal</span>
                </h1>
                <p class="text-gray-400 text-base">Secure access to your dashboard</p>
            </div>

            <!-- Admin Badge -->
            <div class="flex justify-center mb-8 opacity-0 animate-in animate-delay-2">
                <div class="admin-badge">
                    <i class="fas fa-lock"></i>
                    <span>Authorized Access Only</span>
                </div>
            </div>

            <!-- Error Message -->
            <div class="error-message" id="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span id="error-text">Invalid credentials</span>
            </div>

            <!-- Login Form -->
            <form id="admin-login-form" class="space-y-5 opacity-0 animate-in animate-delay-3">
                <div class="input-group">
                    <label class="input-label" for="username">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" class="input-field" placeholder="Enter your username" autocomplete="username" required>
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" class="input-field" style="padding-right: 50px;" placeholder="Enter your password" autocomplete="current-password" required>
                        <i class="fas fa-lock input-icon"></i>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye" id="password-toggle-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="admin-btn" id="login-btn">
                        <i class="fas fa-right-to-bracket"></i>
                        <span id="btn-text">Sign In to Dashboard</span>
                        <div class="spinner hidden" id="btn-spinner"></div>
                    </button>
                </div>
            </form>

            <!-- Footer Info -->
            <div class="text-center mt-8 opacity-0 animate-in animate-delay-4">
                <p class="footer-text">
                    <i class="fas fa-shield-check"></i>
                    Protected by enterprise-grade security
                </p>
            </div>
        </div>

        <!-- Copyright -->
        <div class="text-center mt-6 opacity-0 animate-in animate-delay-5">
            <p class="copyright">
                © 2025 ANDY RCH • Admin Portal
            </p>
        </div>
    </div>

    <script>
        const form = document.getElementById('admin-login-form');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const loginBtn = document.getElementById('login-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const passwordField = document.getElementById('password');
        const passwordToggleIcon = document.getElementById('password-toggle-icon');

        // Toggle password visibility
        function togglePassword() {
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                passwordToggleIcon.classList.remove('fa-eye');
                passwordToggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                passwordToggleIcon.classList.remove('fa-eye-slash');
                passwordToggleIcon.classList.add('fa-eye');
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Show loading state
            loginBtn.disabled = true;
            btnText.textContent = 'Signing in...';
            btnSpinner.classList.remove('hidden');
            loginBtn.querySelector('i').classList.add('hidden');
            errorMessage.classList.remove('show');

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.success) {
                    // Store admin session
                    localStorage.setItem('adminSession', JSON.stringify(result.admin));
                    // Success animation before redirect
                    loginBtn.innerHTML = '<i class="fas fa-check"></i> <span>Success! Redirecting...</span>';
                    loginBtn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                    setTimeout(() => {
                        window.location.href = '/admin';
                    }, 800);
                } else {
                    errorText.textContent = result.message || 'Invalid credentials';
                    errorMessage.classList.add('show');
                    resetButton();
                }
            } catch (error) {
                console.error('Login error:', error);
                errorText.textContent = 'An error occurred. Please try again.';
                errorMessage.classList.add('show');
                resetButton();
            }
        });

        function resetButton() {
            loginBtn.disabled = false;
            btnText.textContent = 'Sign In to Dashboard';
            btnSpinner.classList.add('hidden');
            loginBtn.querySelector('i').classList.remove('hidden');
            loginBtn.style.background = '';
        }

        // Check if already logged in
        async function checkAdminSession() {
            try {
                const response = await fetch('/api/admin/status');
                const result = await response.json();
                
                if (result.authenticated) {
                    window.location.href = '/admin';
                }
            } catch (error) {
                console.error('Error checking admin session:', error);
            }
        }

        checkAdminSession();

        // Add keyboard shortcut hint
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.activeElement !== loginBtn) {
                loginBtn.click();
            }
        });
    </script>
</body>
</html>
